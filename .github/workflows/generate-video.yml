name: Generate Long-Form Documentary

on:
  workflow_dispatch:
    inputs:
      topic:
        description: "Documentary topic"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: documentary-generator
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install Node dependencies
        run: npm install
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      - name: Generate 1080p60 documentary
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          GEMINI_EDITOR_MODEL: ${{ secrets.GEMINI_EDITOR_MODEL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        run: python scripts/generate.py --topic "${{ inputs.topic }}"
      - name: Upload documentary
        uses: actions/upload-artifact@v4
        with:
          name: documentary-video
          path: |
            out/*.mp4
            public/runs/
          if-no-files-found: error
